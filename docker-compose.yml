services:
  postgres:
    image: postgres:16             
    environment:
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: localdevpw
      POSTGRES_DB: talenthunt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   
    healthcheck:                          
      test: ["CMD-SHELL", "pg_isready -U talent"] #check for if service is up
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # docker-compose.yml (add to services block)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console UI
    volumes:
      - minio_data:/data

volumes:
  pgdata:        
  minio_data: