services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    env_file: .env.production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: dockerfile.worker
    env_file: .env.production